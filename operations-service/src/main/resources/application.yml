server:
  port: ${SERVER_PORT:8084}
spring:
  application:
    name: operations-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/induztek_operations?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:induztek}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://service-registry:8761/eureka/}
identity:
  jwt:
    secret: ${JWT_SECRET}
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html
services:
  catalog:
    url: ${CATALOG_SERVICE_URL:http://catalog-service:8083}
media:
  upload-dir: ${UPLOAD_DIR:/app/upload}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
