server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: catalog-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/induztek_catalog?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:induztek_app}
    password: ${MYSQL_PASSWORD:InduztekPass2026!Secure}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://service-registry:8761/eureka/}
identity:
  jwt:
    secret: ${JWT_SECRET:InduztekSuperSecretJwtKeyForInduztekProtocolos2026SecureKey32BytesMinimum}
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html
